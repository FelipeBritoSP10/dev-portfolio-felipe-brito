<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felipe Brito — Portfólio</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
    <link rel="stylesheet" href="./styles/style.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        void: '#0d1117',
                        surface: '#161b27',
                        surface2: '#1e2535',
                        line: '#2a3348',
                        ink: '#e8f0fe',
                        muted: '#8b9bbf',
                        tag: '#60a5fa',
                        str: '#93c5fd',
                        fn: '#38bdf8'
                    },
                    fontFamily: {
                        mono: ['"JetBrains Mono"', 'monospace'],
                        sora: ['"Sora"', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-void text-ink font-sora antialiased">

    <div id="navbar"></div>

    <main>
        <div id="hero"></div>
        <div id="sobre"></div>
        <div id="servicos"></div>
        <div id="habilidades"></div>
        <div id="projetos"></div>
        <div id="depoimentos"></div>

    </main>

    <script src="./scripts/interaction.js"></script>
